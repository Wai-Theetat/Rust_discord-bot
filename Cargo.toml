[package]
name = "bot_discord"
version = "0.1.0"
edition = "2024"
# Two programs: the bot (src/main.rs) and the game launcher (src/bin/launcher.rs).
# Plain `cargo run` starts the bot.
default-run = "bot_discord"

[dependencies]
axum = "0.8.9"
dotenvy = "0.15.7"
rand = "0.10.3"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serenity = { version = "0.12.5", default-features = false, features = ["client", "gateway", "model", "http", "builder", "rustls_backend"] }
sysinfo = { version = "0.40.3", default-features = false, features = ["system"] }
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.2.1"
